name: Ingest

# Refresh prices and filings, rebuild the snapshot, and commit it. Vercel redeploys on the
# push, so the live Brief follows the data without a backend. If a source blocks the runner
# the job keeps the previous snapshot rather than publishing an empty one.
on:
  schedule:
    # Cron is UTC. 13:00 UTC = 18:30 IST (after the close), 18:00 UTC = 23:30 IST
    # (catches filings made through the evening).
    - cron: "0 13 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # The database and document cache persist between runs, so filings already
      # classified and PDFs already read are never paid for twice.
      - uses: actions/cache@v4
        with:
          path: |
            data/finn.db
            data/cache
          key: finn-data-${{ github.run_id }}
          restore-keys: finn-data-

      # Announcements come from NSE's whole-market feed in one request (filtered to the
      # portfolio locally), falling back to per-symbol calls. Prices come from Yahoo, which
      # does not block datacenter IPs. A blocked NSE is recorded in the snapshot's
      # ingest.last_error and surfaced by /health rather than failing silently.
      - name: Fetch prices and announcements
        run: python ingest/fetch.py --days 30
        continue-on-error: true

      # Runs with or without a model key: without one the model steps are skipped and
      # results cards come from the screener fallback, so the snapshot still refreshes.
      - name: Classify, enrich, rank and export
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINN_CHEAP_MODEL: gemini:gemini-3.5-flash-lite
          FINN_STRONG_MODEL: gemini:gemini-3.5-flash
        run: python ingest/process.py

      - name: Commit the snapshot if it changed
        run: |
          git config user.name "finn-ingest"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json frontend/public/snapshot.json
          if git diff --cached --quiet; then
            echo "No change in the snapshot."
          else
            # No "[skip ci]" here. This workflow has no push trigger, so there is no loop to
            # prevent, and several hosts (Vercel among them) read that token as "skip the
            # build" — which would stop the redeploy that is the only way the refreshed
            # snapshot reaches the live site.
            git commit -m "Refresh snapshot"
            git push
          fi

      # Runs after the commit on purpose: a failed ingestion still records its reason in the
      # snapshot, and that record has to reach the live site before the job goes red.
      #
      # A green check must mean "the data actually refreshed". The fetch step is
      # continue-on-error, so without this a blocked exchange produced a run that passed
      # every step, committed nothing, and looked perfectly healthy. A quiet day with no new
      # filings is still a pass; only a recorded ingestion error fails the job.
      - name: Report what the snapshot holds, and fail if ingestion did not work
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          s = json.loads(pathlib.Path("data/snapshot.json").read_text(encoding="utf-8"))
          ing = s.get("ingest") or {}
          err = ing.get("last_error")
          print("generated_at   :", s["generated_at"])
          print("as_of          :", s["as_of"])
          print("filings        :", len(s["announcements"]))
          print("last ingest ok :", ing.get("last_ok_at"))
          print("last attempt   :", ing.get("last_attempted_at"))
          print("last error     :", err or "none")
          if err:
              print(f"::error::Ingestion did not succeed: {err}")
              sys.exit(1)
          PY
