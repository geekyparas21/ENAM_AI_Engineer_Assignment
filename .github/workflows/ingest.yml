name: Ingest

# Refresh prices and filings, rebuild the snapshot, and commit it. Vercel redeploys on the
# push, so the live Brief follows the data without a backend. If a source blocks the runner
# the job keeps the previous snapshot rather than publishing an empty one.
on:
  schedule:
    - cron: "30 11 * * 1-5"    # 17:00 IST on trading days, after the close
    - cron: "0 3,7,15 * * *"   # 08:30, 12:30 and 20:30 IST for announcements
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Opt-in: runs only once the repository variable FINN_INGEST_ENABLED is 'true' and the
    # GEMINI_API_KEY secret is set. Without the key the model-written cards would be lost.
    if: ${{ vars.FINN_INGEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # The database and document cache persist between runs, so filings already
      # classified and PDFs already read are never paid for twice.
      - uses: actions/cache@v4
        with:
          path: |
            data/finn.db
            data/cache
          key: finn-data-${{ github.run_id }}
          restore-keys: finn-data-

      - name: Fetch prices and announcements
        run: python ingest/fetch.py --days 30
        continue-on-error: true

      - name: Classify, enrich, rank and export
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINN_CHEAP_MODEL: gemini:gemini-3.5-flash-lite
          FINN_STRONG_MODEL: gemini:gemini-3.5-flash
        run: python ingest/process.py

      - name: Commit the snapshot if it changed
        run: |
          git config user.name "finn-ingest"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json frontend/public/snapshot.json
          if git diff --cached --quiet; then
            echo "No change in the snapshot."
          else
            git commit -m "Refresh snapshot [skip ci]"
            git push
          fi
